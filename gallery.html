<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Galeri Foto - Web Perdanaku</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #fff0f5; /* Lavender Blush / Pink Sangat Muda */
            color: #4a4a4a;
            line-height: 1.6;
            padding-bottom: 60px; /* Jangkaan untuk footer fixed */
        }

        /* Header & Navigasi */
        header {
            background-color: #ffb6c1; /* Light Pink / Pink Pastel */
            padding: 15px 0;
            box-shadow: 0 2px 5px rgba(255, 182, 193, 0.4);
        }

        nav {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        nav a {
            color: #d1477a; /* Pink Tua / Magenta Manis */
            text-decoration: none;
            padding: 10px 20px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.3s, color 0.3s;
            border-radius: 20px; /* Lebih melengkung agar lucu */
            margin: 0 5px;
        }

        nav a:hover, nav a.active {
            background-color: #ff69b4; /* Hot Pink */
            color: #ffffff;
        }

        /* Konten Utama */
        .container {
            max-width: 900px;
            margin: 40px auto;
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px; /* Sudut membulat */
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
            border-top: 8px solid #ff69b4; /* Aksen Hot Pink di atas */
        }

        h1 {
            color: #d1477a;
            margin-bottom: 20px;
            border-bottom: 2px dashed #ffb6c1; /* Garis putus-putus lucu */
            padding-bottom: 10px;
            text-align: center;
        }

        p {
            margin-bottom: 15px;
            font-size: 16px;
            text-align: center;
        }

        /* Styling Gallery Grid */
        .gallery-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .gallery-item {
            background-color: #fffaf0; 
            color: #6b3342;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            font-weight: bold;
            border: 2px solid #ffb6c1;
            box-shadow: 0 3px 8px rgba(255, 192, 203, 0.3);
            transition: transform 0.2s;
        }

        .gallery-item:hover {
            transform: translateY(-3px);
        }

        /* GAYA UNTUK GAMBAR */
        .gallery-item img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 10px;
        }

        /* Footer */
        footer {
            text-align: center;
            padding: 15px;
            background-color: #ffb6c1;
            color: #5c2c3e;
            position: fixed;
            bottom: 0;
            width: 100%;
            font-size: 14px;
            box-shadow: 0 -2px 5px rgba(255, 182, 193, 0.4);
        }
    </style>
</head>
<body>

    <header>
        <nav>
            <a href="index.html">Home</a>
            <a href="profil.html">Profil</a>
            <a href="about.html">About</a>
            <a href="galery.html" class="active">Gallery</a>
            <a href="kontak.html">Kontak</a>
        </nav>
    </header>

    <div class="container">
        <h1>📸 Galeri Foto 📸</h1>
        <p>Berikut adalah beberapa momen dan foto kegiatan:</p>

        <div class="gallery-grid">
            <!-- FOTO 1 -->
            <div class="gallery-item">
                <img src="Foto1.jpg" alt="Foto 1">
                Foto Olahraga
            </div>

            <!-- FOTO 2 -->
            <div class="gallery-item">
                <img src="Foto2.jpg" alt="Foto 2">
                Foto Jogging pagi
            </div>

            <!-- FOTO 3 -->
            <div class="gallery-item">
                <img src="Foto3.jpg" alt="Foto 3">
                Foto Gym
            </div>

            <!-- FOTO 4 -->
            <div class="gallery-item">
                <img src="Foto4.jpg" alt="Foto 4">
                Foto Jogging Sore 
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Website Perdana. All Rights Reserved.</p>
    </footer>

</body>
</html>
